# Continuous integration for the code.
#
# KI-17 of docs/roadmap/proposed/PLATFORM-BACKEND-STATUS.md: until now nothing enforced
# that the generated GL files still match what the generator emits, and nothing built or
# tested the code on a push at all. natives.yml exists but is path-filtered to
# recipes/** and packaging/**, so an ordinary code change ran no checks whatsoever.
#
# WHY THE FIRST JOB EXISTS, CONCRETELY
#
# Splash.API.OpenGL/generated/GL.g.cs and Splash.OpenGL/Trace/GLTrace.g.cs are generated
# from the Khronos registry. Twice they stopped being reproducible, and neither failed a
# build:
#
#   #89 + #90  Two PRs both regenerated GL.g.cs. Each was verified on its own; git merged
#              them cleanly; the result was a file NO run of gen.py reproduces - 97
#              function pointers and 2 stragglers left on the old delegate emission. It
#              also silently restored the marshalling defect #88 had fixed.
#   WP-5.4     A scripted rename swept *.cs. GL.g.cs is a .cs file, so the sweep edited a
#              comment inside it and the checked-in file stopped matching generator
#              output.
#
# Both were caught by a human remembering to re-run the generators. That is the step this
# job replaces. It runs on pull_request AND on push to master, deliberately: the #89/#90
# failure is a property of the MERGE, so a check that only ever sees the branches cannot
# see it.
#
# WHY IT NEEDS NO .NET AND NO SIBLING CHECKOUTS
#
# gen.py reads surface.json (checked in) and gl.xml (fetched, pinned below). gen-trace.py
# reads GL.g.cs. So the whole check is Python plus one download, and it cannot be broken
# by anything in the second job.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      siblings_from_default_branch:
        description: 'Build against the siblings'' default branches instead of the pinned commits. Use this to find out whether an upstream move has broken us.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  generated:
    name: generated files reproduce
    runs-on: ubuntu-24.04

    env:
      # The Khronos OpenGL registry, pinned to a COMMIT rather than to main.
      #
      # main moves, and a generated file whose input can change underneath it is not
      # reproducible in the sense KI-17 is about. This commit is the revision recorded in
      # WP-5.1-GENERATED-BINDINGS.md section 10, confirmed to serve exactly the pinned
      # sha256 below. Bumping it is a deliberate act: change both lines, re-run the
      # generators, and commit the regenerated files in the same change.
      GL_XML_COMMIT: 0eab18f308d29bb54aa4667013ae505d73a72194
      GL_XML_SHA256: fba2eaa6262cededdba0dd3cd1e3b1806c24899a7c5df8158467e41c19969426

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Fetch the pinned gl.xml
        run: |
          set -euo pipefail
          curl -sSLf -o gl.xml \
            "https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/${GL_XML_COMMIT}/xml/gl.xml"

          # Verified even though the URL is already immutable. If this ever fails, the
          # input changed identity and every "byte-identical" claim below is void - which
          # is a different and much larger problem than a stale generated file.
          echo "${GL_XML_SHA256}  gl.xml" | sha256sum -c -

      - name: Regenerate GL.g.cs and GLTrace.g.cs in place
        run: |
          set -euo pipefail
          python docs/roadmap/proposed/wp-5.1/gen.py \
            docs/roadmap/proposed/wp-5.1/surface/surface.json \
            gl.xml \
            Splash.API.OpenGL/generated/GL.g.cs

          # Reads the file gen.py just wrote, on purpose: the tracer is DERIVED from the
          # binding, so the pair has to be consistent with each other, not merely each
          # consistent with its own last run.
          python docs/roadmap/proposed/wp-5.1/gen-trace.py \
            Splash.API.OpenGL/generated/GL.g.cs \
            Splash.OpenGL/Trace/GLTrace.g.cs

      - name: The checked-in files must be what the generator emits
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Splash.API.OpenGL/generated/GL.g.cs Splash.OpenGL/Trace/GLTrace.g.cs; then
            echo "::error::A generated GL file does not match generator output. It has been hand-edited, or two branches that both regenerated it were merged without regenerating afterwards (KI-17). Do NOT hand-resolve the diff below - re-run the generators and commit the result. The command is in docs/roadmap/proposed/WP-5.1-GENERATED-BINDINGS.md section 9."
            git --no-pager diff --stat -- Splash.API.OpenGL/generated/GL.g.cs Splash.OpenGL/Trace/GLTrace.g.cs
            git --no-pager diff -- Splash.API.OpenGL/generated/GL.g.cs Splash.OpenGL/Trace/GLTrace.g.cs
            exit 1
          fi
          echo "Both generated files reproduce byte-for-byte."

      - name: Generator self-tests
        run: python docs/roadmap/proposed/wp-5.1/test-shapecheck.py


  build-test:
    name: build + unit tests
    runs-on: ubuntu-24.04

    steps:
      # Checked out into a subdirectory so the sibling repositories can sit NEXT to it -
      # the layout Directory.Build.props probes for. Cloning them inside the repo would
      # need -p:SiblingRoot and would put untracked source trees under the working copy.
      - uses: actions/checkout@v7
        with:
          path: Karawan

      # Pinned by commit, not by branch.
      #
      # These are four separate repositories that nothing in this one controls. Floating
      # them means a push somewhere else turns this red, and a CI that goes red for
      # reasons the PR author cannot act on is a CI that gets ignored. Bump them
      # deliberately; workflow_dispatch has an input for checking drift on purpose.
      #
      # The DIRECTORY NAMES are contract: Joyce.csproj spells BepuPhysics2 with that
      # exact casing, and the upstream repository is lowercase "bepuphysics2". A
      # case-insensitive filesystem hides the mismatch; this runner does not, which is
      # part of the value of building here rather than on Windows.
      - name: Check out siblings
        env:
          USE_DEFAULT: ${{ github.event.inputs.siblings_from_default_branch }}
        run: |
          set -euo pipefail
          # Shallow FETCH of the pinned commit, not a blobless partial clone.
          #
          # A partial clone sets extensions.partialClone, which forces
          # core.repositoryFormatVersion to 1 - and the SourceLink task these siblings
          # carry (Microsoft.Build.Tasks.Git 1.1.1) refuses anything above 0:
          #
          #   error : Error reading git repository information: Unsupported repository
          #           version 1. Only versions up to 0 are supported.
          #
          # A shallow repository stays at version 0, so the tool works normally. Fixing
          # the clone shape rather than passing -p:EnableSourceLink=false keeps the
          # failure honest: a real SourceLink problem would still surface.
          #
          # Fetching a bare SHA requires the server to allow it. GitHub does.
          clone() {
            local url="$1" dir="$2" sha="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            if [ "${USE_DEFAULT:-false}" = "true" ]; then
              git -C "$dir" fetch -q --depth 1 origin HEAD
            else
              git -C "$dir" fetch -q --depth 1 origin "$sha"
            fi
            git -C "$dir" checkout -q --detach FETCH_HEAD
            echo "$dir: $(git -C "$dir" rev-parse HEAD)"
          }

          clone https://github.com/TimosForks/bepuphysics2.git       BepuPhysics2         f8223cac41406c56c6ad20214d74416c76ac2876
          clone https://github.com/TimosForks/DefaultEcs.git         DefaultEcs           fa15c43b40f9a078be18a31eb095f08b6e21ea67
          clone https://github.com/TimosForks/ObjLoader.git          ObjLoader            5c4a693194443b801d90cdd6f7d3f9d0664868cf
          clone https://github.com/KhronosGroup/glTF-CSharp-Loader.git glTF-CSharp-Loader 41d9b6b7fe288bae706a8ff80505b3eecf0f1743

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: Karawan/global.json

      - name: Build the test project and everything it needs
        working-directory: Karawan
        run: dotnet build tests/JoyceCode.Tests/JoyceCode.Tests.csproj

      # --logger trx so the skip count is visible in the log rather than folded into a
      # single "Passed!". Several tests skip on a checkout whose assets have not been
      # baked, and a suite that silently skips half of itself while reporting green is
      # the failure mode this whole programme keeps running into.
      - name: Unit tests
        working-directory: Karawan
        run: dotnet test tests/JoyceCode.Tests/JoyceCode.Tests.csproj --no-build --verbosity normal
