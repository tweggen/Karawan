# Native library build matrix.
#
# WP-1.1 of docs/roadmap/proposed/IMPLEMENTATION-PLAN-PLATFORM-BACKEND.md.
#
# Builds openal-soft (WP-1.2) and SDL3 (WP-1.3) for six targets from pinned upstream
# tags. The recipes live in recipes/ and are the same code path a developer runs
# locally; this file only supplies the toolchain and the matrix.
#
# Everything that can drift is pinned. AC-1.5 requires byte-identical artifacts across
# reruns, and floating labels ("macos-latest", "ubuntu-latest") actively prevent that:
# GitHub rotates what they point at. Anything not pinned outright is recorded in the
# build manifest so drift is at least visible in the artifact.

name: natives

on:
  push:
    paths:
      - '.github/workflows/natives.yml'
      - 'recipes/**'
      - 'packaging/**'
  pull_request:
    paths:
      - '.github/workflows/natives.yml'
      - 'recipes/**'
      - 'packaging/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Packages. IRREVERSIBLE - a NuGet version can never be re-published.'
        type: boolean
        default: false
      publish_nuget_org:
        description: 'Publish to nuget.org. MORE irreversible: the package ID is claimed globally and forever, and versions can be unlisted but never deleted. Uses Trusted Publishing (OIDC) - no stored key.'
        type: boolean
        default: false
      version:
        description: 'Package version to publish (e.g. 0.1.0). Ignored unless one of the publish flags is true.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: natives-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android NDK. r27+ is required for 16 KB page alignment to be the default
  # (recipes/BUILD_NOTES.md). This exact revision is what WP-0.0 measured with.
  ANDROID_NDK_VERSION: 27.2.12479018
  # Minimum API must match Wuka's SupportedOSPlatformVersion.
  ANDROID_MIN_API: 26
  # MSVC toolset, selected via vcvarsall -vcvars_ver. 14.44 is the toolset behind
  # compiler 19.44.35228 (VS 2022 17.14), which is what windows-2022 resolved to on
  # the first run of this workflow. Pinned so a runner-image refresh that ships a newer
  # toolset fails loudly here instead of silently changing the artifacts.
  MSVC_TOOLSET: "14.44"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One broken target must not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            kind: linux
          - target: android-arm64-v8a
            runner: ubuntu-24.04
            kind: android
            abi: arm64-v8a
          - target: android-armeabi-v7a
            runner: ubuntu-24.04
            kind: android
            abi: armeabi-v7a
          - target: win-x64
            runner: windows-2022
            kind: windows
          - target: osx-arm64
            runner: macos-15
            kind: macos
            arch: arm64
          - target: osx-x64
            runner: macos-15
            kind: macos
            arch: x86_64

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ------------------------------------------------------------------
      # Toolchain setup
      # ------------------------------------------------------------------

      - name: Install the pinned Android NDK
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          NDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${NDK}" || { echo "NDK not found at ${NDK}"; exit 1; }
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "Installed NDK: ${NDK}"

      # ------------------------------------------------------------------
      # Record the toolchain. Anything not pinned outright must at least be
      # visible in the artifact, so a reproducibility failure (AC-1.5) can be
      # explained rather than guessed at.
      # ------------------------------------------------------------------

      - name: Record toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "target=${{ matrix.target }}"
            echo "runner_image=${{ matrix.runner }}"
            echo "runner_arch=$(uname -m 2>/dev/null || echo unknown)"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "cmake=$(cmake --version | head -1)"
          } > toolchain.txt
          if [ "${{ matrix.kind }}" = "android" ]; then
            echo "ndk=${ANDROID_NDK_VERSION}" >> toolchain.txt
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version \
              | head -1 | sed 's/^/ndk_clang=/' >> toolchain.txt
          elif [ "${{ matrix.kind }}" = "windows" ]; then
            echo "msvc_toolset_pin=${MSVC_TOOLSET:-<unpinned>}" >> toolchain.txt
          else
            cc --version | head -1 | sed 's/^/cc=/' >> toolchain.txt
          fi
          echo "--- toolchain ---"
          cat toolchain.txt

      # ------------------------------------------------------------------
      # Build the natives. One recipe script per library, driven by --target, so
      # CI and a developer's machine run exactly the same code path.
      #
      # Pins live in recipes/versions.env and are exported here so the Windows
      # cmd step sees them too. Each recipe re-checks that the upstream tag still
      # resolves to the pinned commit and refuses to build if it does not.
      # ------------------------------------------------------------------

      # The runner image has no audio development headers, and openal-soft only
      # compiles the backends whose headers it finds at configure time. Without these
      # it builds happily with OSS/WaveFile/Null only - a library that links, loads,
      # and is silent on any modern Linux desktop. The .so does not link these at
      # runtime (openal dlopen()s them); they are build-time headers only.
      - name: Install Linux audio development headers
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev
          {
            echo "apt_libasound2-dev=$(dpkg-query -W -f='${Version}' libasound2-dev)"
            echo "apt_libpulse-dev=$(dpkg-query -W -f='${Version}' libpulse-dev)"
            echo "apt_libpipewire-0.3-dev=$(dpkg-query -W -f='${Version}' libpipewire-0.3-dev)"
          } >> toolchain.txt

      # SDL3 refuses to configure at all without X11 or Wayland development headers,
      # on the grounds that an SDL which cannot open a window is almost never what you
      # meant. It is right. As with the audio headers these are build-time only - SDL3
      # dlopen()s the windowing libraries at runtime.
      - name: Install Linux windowing development headers
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # SDL3's documented Linux build dependencies, installed as a set rather than
          # discovered one CI failure at a time. SDL checks each X11 extension
          # individually and hard-errors on the first one missing (XTEST was the one
          # that bit), so a partial list just moves the failure along by one package.
          # https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev
          {
            echo "apt_libx11-dev=$(dpkg-query -W -f='${Version}' libx11-dev)"
            echo "apt_libwayland-dev=$(dpkg-query -W -f='${Version}' libwayland-dev)"
          } >> toolchain.txt

      - name: Load pinned upstream versions
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z0-9_]+=' recipes/versions.env >> "$GITHUB_ENV"
          echo "--- pinned sources ---"
          grep -E '^[A-Z0-9_]+=' recipes/versions.env

      - name: Build openal-soft (unix)
        if: matrix.kind != 'windows'
        shell: bash
        env:
          ANDROID_MIN_API: ${{ env.ANDROID_MIN_API }}
        run: |
          set -euo pipefail
          bash recipes/build-openal.sh --target "${{ matrix.target }}" --out "$PWD/out/openal"

      - name: Build SDL3 (unix)
        if: matrix.kind != 'windows'
        shell: bash
        env:
          ANDROID_MIN_API: ${{ env.ANDROID_MIN_API }}
        run: |
          set -euo pipefail
          bash recipes/build-sdl3.sh --target "${{ matrix.target }}" --out "$PWD/out/sdl3"

      # vswhere + vcvarsall rather than a third-party setup-msvc action: it is the
      # documented way to select an exact toolset (-vcvars_ver), it removes a
      # supply-chain dependency, and the point of this programme is to depend on
      # things that do not rot. The MSVC environment is inherited by bash, so the
      # same recipe script runs here as everywhere else.
      - name: Build natives (windows)
        if: matrix.kind == 'windows'
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH ( echo ERROR: no MSVC installation found & exit /b 1 )
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=%MSVC_TOOLSET% || exit /b 1
          echo vs_install=%VSPATH%>> toolchain.txt
          cl 2>&1 | findstr /C:"Compiler Version" >> toolchain.txt
          bash recipes/build-openal.sh --target win-x64 --out "%CD%/out/openal" || exit /b 1
          bash recipes/build-sdl3.sh --target win-x64 --out "%CD%/out/sdl3" || exit /b 1

      - name: Show what was produced
        shell: bash
        run: |
          set -euo pipefail
          find out -type f | sort
          echo "--- toolchain ---"
          cat toolchain.txt

      # ------------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives-${{ matrix.target }}
          path: |
            out/
            toolchain.txt
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: manifest
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect toolchain records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Summarise
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## natives build manifest"
            echo
            echo "Commit \`${GITHUB_SHA}\`, run \`${GITHUB_RUN_ID}\`."
            echo
            echo "### Pinned upstream sources"
            echo
            echo '```'
            grep -E '^[A-Z0-9_]+=' recipes/versions.env
            echo '```'
            echo
            echo "### Per-target toolchains"
            echo
            for f in artifacts/*/toolchain.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$(dirname "$f")")</summary>"
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any target failed
        if: needs.build.result != 'success'
        run: |
          echo "One or more matrix targets failed: ${{ needs.build.result }}"
          exit 1

  # --------------------------------------------------------------------------
  # Package the matrix output into a single versioned NuGet (WP-1.4).
  #
  # This job always runs and always uploads the .nupkg as a workflow artifact, so the
  # package can be inspected before anyone commits to a version number. Publishing is
  # a SEPARATE, opt-in job - see below.
  # --------------------------------------------------------------------------
  package:
    name: package
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every target's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          . recipes/versions.env
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            # Every non-manual build gets a unique prerelease version, so nothing can
            # collide with a release and nothing is ever accidentally reusable.
            V="${NATIVES_PACKAGE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${V}"

      - name: Stage the package layout and build manifest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zip
          bash recipes/pack-natives.sh \
            --artifacts artifacts \
            --stage "$PWD/artifacts/stage" \
            --version "${{ steps.ver.outputs.version }}" \
            --run "${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}"

      - name: dotnet pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack packaging/Karawan.Natives/Karawan.Natives.csproj \
            -c Release \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:NativesStage="$PWD/artifacts/stage" \
            -o "$PWD/artifacts/nupkg"
          echo "--- package contents ---"
          cd artifacts/nupkg
          for p in *.nupkg; do echo "== $p =="; unzip -l "$p"; done

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Publishing is IRREVERSIBLE - a NuGet version can never be re-published, which is
  # exactly why the implementation plan (section 2.5) exempts it from independent
  # re-run. It therefore never happens on a push: only on an explicit manual dispatch
  # with publish=true.
  # --------------------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg

      - name: Push to GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          ls -l nupkg
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  # --------------------------------------------------------------------------
  # nuget.org. Separate from the GitHub Packages job on purpose: it is a strictly
  # larger commitment.
  #
  # GitHub Packages NuGet requires authentication even for a PUBLIC package -
  # anonymous restore returns 401, verified - so consuming it would force every
  # contributor and every fork's CI to hold a PAT with read:packages, when today
  # the build needs no credentials at all. nuget.org restores anonymously, which
  # is why the package goes to both.
  #
  # More irreversible than GitHub Packages: the package ID is claimed globally and
  # permanently, and a published version can be unlisted but never deleted.
  # Consequently this has its own opt-in flag, and never runs on a push.
  #
  # Authentication is Trusted Publishing (OIDC), not a stored API key. nuget.org
  # now discourages API keys for automated publishing. NuGet/login exchanges this
  # workflow's short-lived GitHub OIDC token for a short-lived NuGet key, so there
  # is no long-lived secret to leak, rotate, or forget to scope - which is the same
  # class of problem as the PAT already sitting in this repository's remote URL.
  # --------------------------------------------------------------------------
  publish-nuget-org:
    name: publish (nuget.org)
    runs-on: ubuntu-24.04
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget_org
    permissions:
      contents: read
      # Required for Trusted Publishing: lets the job mint an OIDC token that
      # nuget.org can verify came from this repository and workflow.
      id-token: write
    steps:
      - name: Require the nuget.org account name
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER}" ]; then
            echo "The NUGET_USER repository variable is not set."
            echo
            echo "It is a VARIABLE, not a secret - it is only an account name."
            echo "  Settings > Secrets and variables > Actions > Variables > New"
            echo "  name: NUGET_USER   value: <your nuget.org username>"
            echo
            echo "A Trusted Publishing policy for this repository must also exist on"
            echo "nuget.org: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing"
            exit 1
          fi
          echo "Publishing as nuget.org user: ${NUGET_USER}"

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg

      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      # Pinned to a commit like every other action here.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          ls -l nupkg
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
